[project]
name = "mono"
version = "0.1.0"
description = "Mono - Unified Multidisciplinary AI-Driven Engineering Platform"
readme = "README.md"
authors = [
    { name = "Brandon", email = "brandonpalhano@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.13.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
    "zstandard>=0.25.0",
]

[project.scripts]
mono = "mono:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
