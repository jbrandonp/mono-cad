name: CI

on:
  push:
    branches: [master, foundation-reset-2026-11]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked Python environment on the primary desktop OS
        run: uv sync --locked
      - name: Run Python tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Regenerate frontend lockfile in the CI workspace
        working-directory: frontend
        run: bun install
      - name: Verify frozen lockfile installation
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Type-check and build frontend
        working-directory: frontend
        run: bun run build
      - name: Publish regenerated Bun lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bun-lockfile
          path: frontend/bun.lock
          if-no-files-found: error
