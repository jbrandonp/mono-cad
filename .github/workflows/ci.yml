name: CI

on:
  push:
    branches: [master, foundation-reset-2026-11]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  python-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked Python environment on the primary desktop OS
        run: uv sync --locked
      - name: Run Python tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Regenerate stale Bun lockfile
        working-directory: frontend
        run: bun install
      - name: Commit regenerated lockfile on the reconstruction branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/foundation-reset-2026-11'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(frontend): regenerate Bun lockfile"
            git push
          fi
      - name: Verify frozen lockfile installation
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Type-check and build frontend
        working-directory: frontend
        run: bun run build
